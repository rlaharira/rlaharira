<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Lahari R — Software Engineer</title>
<desc id="desc">A professional navy and teal technology banner with subtle grid and circuit-line details.</desc>
<defs>
